<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Inventory | Automania Systems</title>
    <style>
        /* Automania Premium Enterprise Dark Theme */
        :root {
            --bg-dark: #0f1015;
            --card-bg: #1c1d24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --dinaledi-orange: #f39200; 
            --dinaledi-orange-hover: #d68000;
            --bi-blue: #3b82f6;
            --bi-red: #ef4444;
            --bi-green: #10b981;
            --border-color: #2d2e36;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-branding {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-branding img {
            max-height: 50px; 
            width: auto;
        }

        .header-titles h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
        .header-titles p { margin: 5px 0 0 0; font-size: 13px; color: var(--dinaledi-orange); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .nav-container { display: flex; gap: 10px; }

        .nav-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .nav-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        /* Summary KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--bi-blue); }
        .kpi-card.orange::before { background: var(--dinaledi-orange); }
        .kpi-card.red::before { background: var(--bi-red); }

        .kpi-value { font-size: 28px; font-weight: 800; color: white; margin-bottom: 5px; }
        .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

        /* Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .search-bar:focus { border-color: var(--dinaledi-orange); }

        /* Table Styling */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-height: 600px;
        }
        
        /* Custom Scrollbar */
        .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-wrapper::-webkit-scrollbar-track { background: var(--bg-dark); }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        thead { background: var(--bg-dark); position: sticky; top: 0; z-index: 10; }
        th { padding: 15px; border-bottom: 2px solid var(--border-color); color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* Stock Status Badges */
        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .status-ok { background: rgba(16, 185, 129, 0.15); color: var(--bi-green); border: 1px solid var(--bi-green); }
        .status-low { background: rgba(243, 146, 0, 0.15); color: var(--dinaledi-orange); border: 1px solid var(--dinaledi-orange); }
        .status-out { background: rgba(239, 68, 68, 0.15); color: var(--bi-red); border: 1px solid var(--bi-red); }

        .current-balance { font-size: 16px; font-weight: 800; color: white; }

        #statusMessage { text-align: center; padding: 40px; color: var(--dinaledi-orange); font-style: italic; font-size: 14px; }

        @media (max-width: 900px) {
            .header { flex-direction: column; gap: 20px; text-align: center; }
            .header-branding { flex-direction: column; }
            .nav-container { flex-direction: column; width: 100%; }
            .nav-btn { text-align: center; }
            .kpi-grid { grid-template-columns: 1fr; }
            .search-bar { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-branding">
            <img src="Dinaledi1.png" alt="Dinaledi Logo">
            <div class="header-titles">
                <h1>Master Inventory Tracking</h1>
                <p>Live Stock Balances</p>
            </div>
        </div>
        <div class="nav-container">
            <a href="Dinaledi.html" class="nav-btn">← Floor Terminal</a>
            <a href="BI.html" class="nav-btn" style="border-color: var(--bi-blue); color: var(--bi-blue);">📊 Dashboard BI</a>
            <a href="Audit.html" class="nav-btn">🗄️ Master Ledger</a>
        </div>
    </div>

    <div id="statusMessage">Calculating live inventory from transaction history...</div>

    <div id="dashboard-content" style="display: none;">
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-value" id="kpi-unique-items">0</div>
                <div class="kpi-label">Total Unique Materials</div>
            </div>
            <div class="kpi-card orange">
                <div class="kpi-value" id="kpi-low-stock">0</div>
                <div class="kpi-label">Items Low on Stock (< 20)</div>
            </div>
            <div class="kpi-card red">
                <div class="kpi-value" id="kpi-out-stock">0</div>
                <div class="kpi-label">Items Out of Stock (0)</div>
            </div>
        </div>

        <div class="card">
            <div class="controls-bar">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search for a material..." onkeyup="filterTable()">
            </div>

            <div class="table-wrapper">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>Material Description</th>
                            <th>Total IN</th>
                            <th>Total OUT</th>
                            <th>Current Balance</th>
                            <th>Stock Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbx7rsialRRxeUm82hS9NcWiZ1SB_ujYArdp-zmhelaJtevdCsRV04609sQBlAq7qjfV0w/exec';
        
        // Master List to force all 151 items to appear, even if they have 0 transactions
        const inventoryDataList = {
            "AERONTEC": [
                "Bleather Cloth", "163gsm Twill Weave Glass", "Peelply", "Sealant Tape Grey",
                "Sealant Tape Yellow", "Sicomin SD 4771 Laminating ultra slow hardener",
                "Sicomin SD 4775 laminating medium hardener", "400gsm Glass Biax",
                "200gsm Carbon Twill stabilized", "Paper cup 500ml", "Paper cup 250ml",
                "My cell M080 Eco", "Skin protection cream", "Release Film High Temp",
                "Sicomic SD 7820 Hardener high Temp", "Sicomin Epoxy Resin SR 1660 High Temp",
                "MYCELL 80 GREEN"
            ],
            "AMT": [
                "TONGUE DEPRESSORS (100 PER BOX)", "SEALANT TAPE (40 PER BOX)", "CARBON FAB 200GSM",
                "GLASS FAB 163g/92110/100\\", "AIRBLEED 100 - 1520MM X 100M (Breather)",
                "RELEASE FILM A2200 P3/1.45M/500/120C [I036]", "PRIME 37 RESIN (4.5KG)",
                "AMPREG 3X SLOW HARDENER (1.3KG)", "PRIME 37 RESIN (16.15KG) - (Infusion) for Coil Sep",
                "AMPREG 3X SLOW HARDENER (4.68KG) (Infusion) for Coil Sep", "GLASS ROVING 2400 TEX (DIRECT ROVING) for Coil Sep",
                "PIGMENT EPOXY - BLACK (5KG)", "PEELPLY NYLON 078g/1616/150 ECC", "PEELPLY NYLON 085g/LTX/PS 1000MM",
                "FASTCAST F160", "EP GC080/GC14", "CUPS 500ml (50 CUPS PER PACK)",
                "TENSORGRIP TC49 INFUSION HI-TAC FINE", "VACFILM 450V 50MIC"
            ],
            "ATLIN / ATLAND": [
                "COTTON FLOCKS 1*2KG", "AEROSIL 200 FUMED SILICA - 1*10KG",
                "SEMI-RIGID ISO LAMINATING RESIN 1*25KG (Polyester)", "AKPEROX A50 CATALYST 1*500ML",
                "RAMWAX RUN-IN 1*5LT", "PVA RED RELEASE AGENT 1*4.4KG", "ONE SIDE FEATHERED CSM450 1*45KG"
            ],
            "DURA PAINTS": [
                "Enamel sunshine yellow 5L,10L and 20L", "QD Enamel Ford Tractor Blue 5L,10L and 20L",
                "Anchorbond Aluminium 5L,10L and 20L"
            ],
            "MATRIXXX": [
                "DCR30 - Epoxy Resin - 25 KG", "DCH10 - Epoxy Hardener - Slow - 25 KG",
                "DCH20 - Epoxy Hardener - Medium - 25 KG"
            ],
            "MEGAPHASE": [
                "LUGS 35mmx12mm", "LUGS 16mmx12mm", "LUGS 6mmx10mm", "LUGS 6mmx8mm", "LUGS 10mmx12mm",
                "LUGS 25mmx8mm", "LUGS 25mmx12mm", "LUGS 35mmx10mm", "LUGS 16mmx10mm", "LUGS 10mmx8mm",
                "LUGS 25mmx10mm", "LUGS16mmx8mm", "LUGS 50mmx12mm", "Heat Shrink_Red -19mm",
                "Heat Shrink_Black - 9,5mm", "Heat Shrink_Black -19/20mm", "Heat Shrink_Black -6,4mm",
                "Heat Shrink_Black -4,8mm", "Heat Shrink_Blue -9,5mm", "Heat Shrink_Red -9,5mm",
                "Heat Shrink_White -12,7mm", "Heat Shrink_Red -12,7mm", "Heat Shrink_Green/Yellow -12,7mm",
                "Heat Shrink_Blue -12,7mm", "Heat Shrink_Clear -12,7mm", "Heat Shrink_Yellow -12,7mm",
                "Heat Shrink_Blue -19/20mm", "Heat Shrink_White -19/20mm", "Heat Shrink_Clear -20mm",
                "Heat Shrink_Green/Yellow -20mm", "Heat Shrink_Clear -9,5mm"
            ],
            "MOOT BOLT & NUT": [
                "Dust musk", "Markers", "Drill bit size-5mm ,6mm ,8mm ,10mm", "Cutting Disc",
                "Hole Saw - 89mm", "Hole Saw - 46mm", "Gloves Ninja"
            ],
            "NIVITEX": [
                "Wove Roving- 400gsm -Plain Weave Glass"
            ],
            "PLASTILON": [
                "Tubing-Smokey", "Tis.Jumbo wipe", "Pallet wrap core", "Airothene",
                "Cutter /Blade large", "Sheeting Black", "Zipper bag", "Plastic sleeves (Blue)",
                "Disposable mop caps (white0", "Bucket 1Lt White"
            ],
            "REBEL PAINT & PANEL": [
                "Masking tape 24mm", "Masking tape 48mm", "B/Fill 220 fine stopper 1kg",
                "B/Fill Hardener past 100g", "P2000 water paper", "P1200 water paper",
                "Soudal 40fc Black 310ml", "Paint strainer(190micron)", "Brush fibreglass 25mm",
                "Brush fibreglass 50mm", "Scotch pad Eka very fine", "Rebel pre filter",
                "Gerson half mask replaceable", "Waste rags white", "Solvent lacquer Thinners 200Lt And Solvent Acetone 200lt",
                "Black etch primer 5lt", "QD ford tractor blue 5lt", "QD white Etch prime 5lt",
                "QD Red oxide Etch primer 5lt", "2K Hardener 5lt", "2K Thinners (GDK) 5lt",
                "2K MS primer white 5lt", "2K Black 5lt", "2K Clear coat Auto gold 5lt",
                "2K Fast cure Additive 1lt", "2K HS primer Grey (Nurana)", "Plascon Acryline 2K Toner white"
            ],
            "TRANSTECHNICAL (TTS)": [
                "Gland M40", "Gland M25", "Gland M32", "Gland M63", "Gland M50", "Connector M50",
                "Connector M40", "Connector M25", "Connector M32", "Connector M63",
                "Stopper plug M63", "Stopper plug M25", "Stopper plug M50", "Stopper plug M40",
                "Stopper plug M32", "Reducer 40-25mm", "Reducer 32-25mm", "Reducer 50-40mm",
                "Reducer 63-50mm", "Reducer 40-32mm", "Enlarger M50-M40", "Enlarger M32-M40", "Enlarger m25-m32"
            ]
        };

        let inventoryMap = {};

        async function calculateInventory() {
            try {
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    processData(result.data);
                } else {
                    document.getElementById('statusMessage').innerHTML = "Database Error.";
                }
            } catch (error) {
                document.getElementById('statusMessage').innerHTML = "Network connection failed.";
            }
        }

        function processData(logs) {
            inventoryMap = {};

            // PRE-LOAD ALL 151 MATERIALS AT 0 BALANCE FIRST
            for (const supplier in inventoryDataList) {
                inventoryDataList[supplier].forEach(item => {
                    inventoryMap[item] = { in: 0, out: 0, balance: 0 };
                });
            }

            // Calculate totals from transaction history with sanitization
            logs.forEach(row => {
                let mat = row.material ? row.material.toString().trim() : "Unknown";
                let action = row.action ? row.action.toString().trim().toUpperCase() : "";
                let qty = parseFloat(row.quantity) || 0;

                // Ensure it exists just in case there's old historical data not on the new list
                if (!inventoryMap[mat]) {
                    inventoryMap[mat] = { in: 0, out: 0, balance: 0 };
                }

                if (action === 'IN') {
                    inventoryMap[mat].in += qty;
                    inventoryMap[mat].balance += qty;
                } else if (action === 'OUT') {
                    inventoryMap[mat].out += qty;
                    inventoryMap[mat].balance -= qty;
                }
            });

            renderInventoryTable();
        }

        function renderInventoryTable() {
            const tbody = document.getElementById('inventoryBody');
            tbody.innerHTML = '';
            
            let lowStockCount = 0;
            let outOfStockCount = 0;

            // Sort alphabetically by material name
            let sortedMaterials = Object.keys(inventoryMap).sort();

            sortedMaterials.forEach(mat => {
                let data = inventoryMap[mat];
                
                // Prevent negative balances in visual display
                let visualBalance = data.balance < 0 ? 0 : data.balance;

                // Status Logic (Threshold set to < 20)
                let statusHtml = '';
                if (visualBalance === 0) {
                    statusHtml = `<span class="status-badge status-out">Out of Stock</span>`;
                    outOfStockCount++;
                } else if (visualBalance < 20) { 
                    statusHtml = `<span class="status-badge status-low">Low Stock</span>`;
                    lowStockCount++;
                } else {
                    statusHtml = `<span class="status-badge status-ok">In Stock</span>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600; color: white;">${mat}</td>
                    <td style="color: var(--text-muted);">${data.in.toLocaleString()} units</td>
                    <td style="color: var(--text-muted);">${data.out.toLocaleString()} units</td>
                    <td class="current-balance">${visualBalance.toLocaleString()}</td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });

            // Update KPIs
            document.getElementById('kpi-unique-items').innerText = sortedMaterials.length;
            document.getElementById('kpi-low-stock').innerText = lowStockCount;
            document.getElementById('kpi-out-stock').innerText = outOfStockCount;

            document.getElementById('statusMessage').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
        }

        function filterTable() {
            let input = document.getElementById('searchInput').value.toUpperCase();
            let table = document.getElementById('inventoryTable');
            let tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName('td')[0]; // Filter by Material Name (Column 1)
                if (td) {
                    let txtValue = td.textContent || td.innerText;
                    if (txtValue.toUpperCase().indexOf(input) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        window.onload = calculateInventory;
    </script>
</body>
</html>
