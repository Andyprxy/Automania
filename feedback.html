<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rate Your Experience | Automania</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --apple-grey: #86868b;
            --apple-blue: #0071e3;
            --apple-gold: #f5a623; /* Darker Gold for Text Readability */
            --apple-black: #1d1d1f;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.5);
            --brand-gradient: linear-gradient(135deg, #0071e3, #00AEEF);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #fbfbfd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--apple-black);
            overflow-x: hidden;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 70% 30%, rgba(0, 174, 239, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 30% 70%, rgba(0, 113, 227, 0.1) 0%, transparent 50%);
        }

        /* Main Glass Card */
        .form-container {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

        /* Header */
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--apple-blue); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
        p { color: var(--apple-grey); font-size: 0.95rem; line-height: 1.5; }

        /* Form Elements */
        .form-group { margin-bottom: 20px; text-align: left; }
        
        /* Standard Blue Label */
        label { 
            display: block; 
            font-size: 0.9rem; 
            font-weight: 700; 
            color: var(--apple-blue);
            margin-bottom: 8px; 
            margin-left: 10px; 
            letter-spacing: -0.01em;
        }

        /* Specific Color Overrides */
        .label-gold { color: var(--apple-gold) !important; }
        .label-grey { color: var(--apple-grey) !important; font-weight: 500; }
        
        /* Frosted Bubble Inputs */
        .input-bubble {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 18px;
            font-size: 1rem;
            color: var(--apple-black);
            outline: none;
            transition: all 0.2s ease;
        }
        
        .input-bubble:focus {
            background: #fff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
            transform: scale(1.01);
        }

        textarea.input-bubble { resize: none; height: 100px; }

        /* Star Rating System */
        .rating-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 30px 0;
            flex-direction: row-reverse;
        }

        .rating-group input { display: none; }

        .rating-group label {
            font-size: 2.5rem;
            color: #d1d1d6;
            cursor: pointer;
            transition: color 0.2s;
            margin: 0; 
        }

        .rating-group label:hover,
        .rating-group label:hover ~ label,
        .rating-group input:checked ~ label {
            color: #ffb400; /* Gold */
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--apple-black);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .submit-btn:hover {
            transform: scale(1.02);
            background: #000;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Success & Loading States */
        .hidden { display: none; }
        
        .loader {
            width: 24px; height: 24px;
            border: 3px solid #fff; border-top-color: transparent;
            border-radius: 50%; display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .success-message { text-align: center; padding: 20px; }
        .success-icon { font-size: 4rem; margin-bottom: 20px; display: block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="form-container" id="mainForm">
        <div class="header">
            <span class="logo">Automania</span>
            <h1>Thank you for choosing us.</h1>
            <p>We value your partnership. Please verify your details and rate your experience below.</p>
        </div>

        <form id="feedbackForm" onsubmit="handleSubmit(event)">
            
            <div class="form-group">
                <label>Business Name *</label>
                <input type="text" id="businessName" class="input-bubble" placeholder="e.g. Acme Corp" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" class="input-bubble" placeholder="name@company.com" required>
            </div>

            <div class="form-group" style="text-align: center;">
                <label class="label-gold" style="margin: 0 0 10px 0; text-align: center;">Overall Experience (1-5) *</label>
                <div class="rating-group">
                    <input type="radio" name="rating" id="star5" value="5" required><label for="star5">★</label>
                    <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                    <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                    <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                    <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                </div>
            </div>

            <div class="form-group">
                <label class="label-grey">Additional Comments (Optional)</label>
                <textarea id="comments" class="input-bubble" placeholder="Tell us more about what we did well or how we can improve..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Submit Feedback
            </button>

        </form>
    </div>

    <div class="form-container hidden" id="successCard">
        <div class="success-message">
            <span class="success-icon">🎉</span>
            <h1>Thanks!</h1>
            <p style="margin-bottom: 20px;">We have received your feedback.</p>
            <p>Please check your email inbox for a confirmation.</p>
        </div>
    </div>

    <script>
        async function handleSubmit(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            
            // Get Values
            const businessName = document.getElementById('businessName').value;
            const email = document.getElementById('email').value;
            const comments = document.getElementById('comments').value;
            const ratingEl = document.querySelector('input[name="rating"]:checked');
            const rating = ratingEl ? parseInt(ratingEl.value) : null;

            if (!rating) {
                alert("Please select a star rating.");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>';

            const payload = {
                businessName: businessName,
                email: email,
                rating: rating,
                comments: comments,
                timestamp: new Date().toISOString()
            };

            try {
                // YOUR WEBHOOK URL
                const webhookUrl = 'https://my-n8n-server-3wbt.onrender.com/webhook-test/4893183f-25a1-4684-8a69-e5c4134f76e0'; 
                
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // --- SMART REDIRECT LOGIC ---
                if (rating >= 4) {
                    // 4 or 5 Stars: Redirect to Google
                    window.location.href = "https://g.page/r/CUknRON2efALEAE/review";
                } else {
                    // 1-3 Stars: Keep them here (Private Feedback)
                    document.getElementById('mainForm').classList.add('hidden');
                    document.getElementById('successCard').classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error:', error);
                alert("Connection error. Please try again.");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }
    </script>

</body>
</html>
