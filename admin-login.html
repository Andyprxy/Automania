<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | Automania</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="favicon.jpg">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#020617', 
                        surface: '#0f172a',
                    },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-in': 'fadeIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #020617; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* Grid Background */
        .bg-grid {
            position: absolute; inset: 0; z-index: 0;
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .passcode-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            letter-spacing: 0.5em;
            font-size: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .passcode-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        /* Hide number arrows */
        .passcode-input::-webkit-outer-spin-button,
        .passcode-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="relative z-10 w-full max-w-md p-4 animate-fade-in">
        <div class="glass-card rounded-2xl p-8 text-center" id="loginCard">
            
            <div class="mx-auto w-16 h-16 bg-blue-500/10 rounded-full flex items-center justify-center mb-6 text-blue-400 border border-blue-500/20">
                <i data-lucide="shield-lock" class="w-8 h-8"></i>
            </div>

            <h1 class="text-2xl font-bold mb-2">Restricted Access</h1>
            <p class="text-slate-400 text-sm mb-8">
                This portal is for Automania Administrators only.<br>
                Please verify your credentials.
            </p>

            <form id="authForm" onsubmit="checkPasscode(event)" class="space-y-6">
                <div>
                    <input 
                        type="password" 
                        id="passcode" 
                        placeholder="•••••" 
                        maxlength="5"
                        class="passcode-input w-full p-4 rounded-xl placeholder-slate-600 font-mono"
                        autofocus
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 group"
                >
                    <span>Unlock Command Centre</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div id="errorMsg" class="mt-4 text-red-400 text-sm font-medium opacity-0 transition-opacity flex items-center justify-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span>Access Denied: Invalid Passcode</span>
            </div>
            
            <div class="mt-8 pt-6 border-t border-white/5">
                <a href="appprt.html" class="text-xs text-slate-500 hover:text-white transition-colors">
                    &larr; Return to Gateway
                </a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function checkPasscode(e) {
            e.preventDefault();
            
            const input = document.getElementById('passcode');
            const card = document.getElementById('loginCard');
            const errorMsg = document.getElementById('errorMsg');
            const code = input.value;

            // THE AUTH LOGIC
            if (code === '10111') {
                // Success
                errorMsg.style.opacity = '0';
                
                // Change button text to show success state
                const btn = document.querySelector('button[type="submit"]');
                btn.innerHTML = `<i data-lucide="check" class="w-5 h-5"></i> Verified`;
                btn.classList.remove('bg-blue-600');
                btn.classList.add('bg-emerald-500');
                lucide.createIcons();

                // Small delay for UX, then redirect
                setTimeout(() => {
                    window.location.href = 'command-centre.html';
                }, 800);

            } else {
                // Failure
                errorMsg.style.opacity = '1';
                input.value = ''; // Clear input
                
                // Shake animation
                card.classList.remove('animate-shake');
                void card.offsetWidth; // Trigger reflow
                card.classList.add('animate-shake');
                
                input.focus();
            }
        }
    </script>
</body>
</html>
