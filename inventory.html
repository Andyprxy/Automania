<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Access | Dinaledi Composite Engineering</title>
    <style>
        /* Automania Premium Enterprise Dark Theme */
        :root {
            --bg-dark: #0f1015;
            --card-bg: #1c1d24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --dinaledi-orange: #f39200; 
            --dinaledi-orange-hover: #d68000;
            --border-color: #2d2e36;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }

        /* Top accent line */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--dinaledi-orange);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        .system-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .system-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .key-input {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: white;
            font-size: 16px;
            text-align: center;
            font-family: monospace;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase; /* visually forces uppercase */
        }

        .key-input:focus {
            outline: none;
            border-color: var(--dinaledi-orange);
            box-shadow: 0 0 10px rgba(243, 146, 0, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--dinaledi-orange);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background-color: var(--dinaledi-orange-hover);
            transform: translateY(-2px);
        }

        /* Error Message styling */
        .error-msg {
            color: #ef4444; /* red */
            font-size: 12px;
            margin-top: 15px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.visible {
            opacity: 1;
        }

        .footer-branding {
            margin-top: 30px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <img src="Dinaledi1.png" alt="Dinaledi Logo" class="logo">
        
        <div class="system-title">Live Inventory Terminal</div>
        <div class="system-subtitle">Secured by Automania Systems</div>

        <div class="input-group">
            <label for="accessKey">System Access Key</label>
            <input type="text" id="accessKey" class="key-input" placeholder="ENTER KEY" autocomplete="off" onkeypress="handleEnter(event)">
        </div>

        <button class="submit-btn" onclick="verifyKey()">Verify & Access</button>

        <div id="errorMessage" class="error-msg">Invalid Access Key. Please try again.</div>

        <div class="footer-branding">
            © 2026 Automania Systems. All rights reserved.
        </div>
    </div>

    <script>
        function verifyKey() {
            // Get the value, remove accidental spaces, and force it to UPPERCASE
            const inputKey = document.getElementById('accessKey').value.trim().toUpperCase();
            const errorMsg = document.getElementById('errorMessage');

            // The target key
            const correctKey = "DINALEDI2026";

            if (inputKey === correctKey) {
                // Success: hide error, add a nice little button animation, and redirect
                errorMsg.classList.remove('visible');
                document.querySelector('.submit-btn').innerText = "AUTHORIZING...";
                document.querySelector('.submit-btn').style.backgroundColor = "#10b981"; // turns green
                document.querySelector('.submit-btn').style.color = "#fff";
                
                // Redirect to the floor terminal
                setTimeout(() => {
                    window.location.href = "Dinaledi.html";
                }, 600); // 0.6 second delay to make the authorization look organic

            } else {
                // Fail: show error message and clear input
                errorMsg.classList.add('visible');
                document.getElementById('accessKey').value = "";
                document.getElementById('accessKey').focus();
            }
        }

        // Allow user to hit the "Enter" key on their keyboard/phone to submit
        function handleEnter(event) {
            if (event.key === "Enter") {
                verifyKey();
            }
        }
    </script>
</body>
</html>
